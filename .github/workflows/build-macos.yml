name: Build macOS

on:
  workflow_dispatch:  # manual only

jobs:
  build-macos:
    name: macOS
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          setup-python: false
          version: '6.12.0'
          host: 'mac'
          target: 'desktop'
          modules: 'qtnetworkauth qtmultimedia'
          cache: true
      
      - name: Configure CMake
        run: cmake --preset macos-release
      
      - name: Build
        run: cmake --build --preset macos-release
      
      - name: Test
        run: ctest --test-dir out/build/macos-release --output-on-failure
      
      - name: Deploy Qt dependencies
        run: |
          chmod +x deploy_mac.sh
          ./deploy_mac.sh out/build/macos-release
      
      - name: Verify multimedia deployment
        run: |
          test -n "$(find out/build/macos-release/VelocityNext/VelocityNext.app -iname 'libffmpegmediaplugin.dylib' -print -quit)" || \
            { echo "Qt multimedia backend missing from the bundle"; find out/build/macos-release/VelocityNext/VelocityNext.app -maxdepth 4 -type d; exit 1; }

      - name: Create DMG
        run: |
          mkdir dmg-contents
          cp -R out/build/macos-release/VelocityNext/VelocityNext.app dmg-contents/
          hdiutil create -volname "Velocity-Next" -srcfolder dmg-contents -ov -format UDZO Velocity-Next-macOS.dmg
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-Next-macOS
          path: Velocity-Next-macOS.dmg
