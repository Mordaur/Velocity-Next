name: Build Windows (MinGW)

on:
  workflow_dispatch:  # manual only

jobs:
  build-windows-mingw:
    name: Windows (MinGW)
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # aqt 3.3.0 cannot read the Qt 6.11+ Windows repository layout; the
          # fix is PR #1000 and is not in a release yet. Drop this pin once aqt
          # ships it.
          python -m pip install "aqtinstall @ git+https://github.com/miurahr/aqtinstall.git@refs/pull/1000/head"
          python -m aqt install-qt windows desktop 6.12.0 win64_mingw --outputdir C:/Qt --autodesktop -m qtnetworkauth
          python -m aqt install-tool windows desktop tools_mingw1310 --outputdir C:/Qt
          "QT_ROOT_DIR=C:/Qt/6.12.0/mingw_64" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=C:/Qt/6.12.0/mingw_64" >> $env:GITHUB_ENV
          "C:/Qt/6.12.0/mingw_64/bin" >> $env:GITHUB_PATH
          "C:/Qt/Tools/mingw1310_64/bin" >> $env:GITHUB_PATH
      
      - name: Setup MinGW environment
        id: mingw-setup
        run: |
          $qtRoot = "$env:QT_ROOT_DIR"
          echo "Qt root: $qtRoot"
          
          $mingwPath = $null
          
          # Priority 1: Check Qt's bin directory for bundled MinGW
          $qtBinPath = Join-Path $qtRoot "bin"
          if (Test-Path (Join-Path $qtBinPath "g++.exe")) {
            $mingwPath = $qtBinPath
            echo "✅ Found MinGW in Qt bin: $mingwPath"
          }
          
          # Priority 2: Check Tools directory for separate MinGW installation
          if (-not $mingwPath) {
            $toolsRoot = (Get-Item $qtRoot).Parent.Parent.FullName
            $toolsPath = Join-Path $toolsRoot "Tools"
            echo "Checking Tools directory: $toolsPath"
            
            if (Test-Path $toolsPath) {
              echo "Tools contents:"
              Get-ChildItem $toolsPath -Directory | ForEach-Object { echo "  - $($_.Name)" }
              
              # Look for any mingw directory
              $mingwDir = Get-ChildItem $toolsPath -Directory -Filter "mingw*" | 
                         Sort-Object Name -Descending | 
                         Select-Object -First 1
              if ($mingwDir) {
                $mingwBinPath = Join-Path $mingwDir.FullName "bin"
                if (Test-Path (Join-Path $mingwBinPath "g++.exe")) {
                  $mingwPath = $mingwBinPath
                  echo "✅ Found MinGW in Tools: $mingwPath ($($mingwDir.Name))"
                }
              }
            }
          }
          
          # ERROR if Qt's MinGW not found - do NOT use system MinGW
          if (-not $mingwPath) {
            echo "❌ ERROR: Qt's MinGW not found!"
            echo "Qt's MinGW is required for ABI compatibility with Qt libraries."
            echo "System MinGW causes linking errors with Qt6EntryPoint."
            echo ""
            echo "Searched locations:"
            echo "  - Qt bin: $qtBinPath"
            echo "  - Qt Tools: $toolsPath"
            exit 1
          }
          
          # Verify compilers exist
          $gccPath = Join-Path $mingwPath "gcc.exe"
          $gxxPath = Join-Path $mingwPath "g++.exe"
          
          if (-not (Test-Path $gccPath) -or -not (Test-Path $gxxPath)) {
            echo "❌ ERROR: Compilers not found at $mingwPath"
            exit 1
          }
          
          echo "✅ Using Qt's MinGW:"
          echo "  Path: $mingwPath"
          echo "  GCC: $gccPath"
          echo "  G++: $gxxPath"
          
          # Set step outputs
          echo "mingw-path=$mingwPath" >> $env:GITHUB_OUTPUT
          echo "c-compiler=$gccPath" >> $env:GITHUB_OUTPUT
          echo "cxx-compiler=$gxxPath" >> $env:GITHUB_OUTPUT
          
          # Test compiler version
          & $gxxPath --version
        shell: pwsh
      
      - name: Configure CMake
        run: |
          $env:PATH = "${{ steps.mingw-setup.outputs.mingw-path }};$env:PATH"
          cmake --preset windows-mingw-release `
            -DCMAKE_C_COMPILER="${{ steps.mingw-setup.outputs.c-compiler }}" `
            -DCMAKE_CXX_COMPILER="${{ steps.mingw-setup.outputs.cxx-compiler }}" `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
        shell: pwsh
      
      - name: Build
        run: |
          $env:PATH = "${{ steps.mingw-setup.outputs.mingw-path }};$env:PATH"
          cmake --build --preset windows-mingw-release
        shell: pwsh
      
      - name: Package
        run: |
          mkdir release-mingw
          cp out/build/windows-mingw-release/VelocityNext/VelocityNext.exe release-mingw/
          cp out/build/windows-mingw-release/XboxInternals/libXboxInternals.dll release-mingw/
          windeployqt release-mingw/VelocityNext.exe
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-Next-Windows
          path: release-mingw/
