name: Create Release

on:
  workflow_run:
    workflows: ["Build (Matrix)"]
    types:
      - completed
  workflow_dispatch:

# Needed for actions/download-artifact with a run-id and for gh-release.
permissions:
  contents: write
  actions: read

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The matrix build also runs on branches, so derive the tag from the
      # project version rather than publishing a release named after `master`.
      - name: Determine release tag
        id: tag
        run: |
          ref="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          if [ "${ref#v}" != "$ref" ]; then
            echo "tag=$ref" >> "$GITHUB_OUTPUT"
          else
            version=$(sed -n 's/^project(VelocityNext VERSION \([0-9.]*\).*/v\1/p' CMakeLists.txt | head -1)
            if [ -z "$version" ]; then
              echo "Could not determine a release tag from CMakeLists.txt" >&2
              exit 1
            fi
            echo "tag=$version" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      # In a workflow_run context the artifacts live in the triggering run, not
      # in this one; without the run-id download-artifact looks in the wrong run
      # and the release ends up without files.
      - name: Download artifacts from the triggering build
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts from this run
        if: github.event_name != 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ steps.tag.outputs.tag }}
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            artifacts/*.zip
            artifacts/*.dmg
            artifacts/*.tar.gz 
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
